<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prevClimática</title>
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="shortcut icon" href="./assets/img/iconCloud.png" type="image/x-icon">
</head>
<body class="">
    <main class="">
        <div class="col-1">
            <form action="">
                <input type="text" name="" id="input-city">
                <button id="search-bttn">
                    <img src="./assets/img/icon-search2.png" alt="">
                </button>
            </form>
            <section id="container-temp-today">
                <div class="grid-temp-icon">
                    <p id="temp-today">20°</p>
                    <div class="icon-container">
                        <img src="./assets/img/iconClear.png" alt="icon-temp" id="icon-temp-today">
                    </div>
                </div>
                <h1 id="city-name">Camaçari</h1>
                <p id="clock">21:00</p>
            </section>
        </div>
        <div class="col-2">
            <section id="container-details">
                <h2>More Details</h2>
                <div class="grid">
                    <section id="section-feels-like">
                        <h3>Feels Like</h3>
                        <p><span id="feels-like-value"></span></p>
                    </section>
                    <section id="section-humidity">
                        <h3>Humidity</h3>
                        <p><span id="humidity-value"></span></p>
                    </section>
                    <section id="section-wind">
                        <h3>Wind</h3>
                        <p><span id="wind-value"></span></p>
                    </section>
                </div>
            </section>
            <section id="container-forecast">
                <h2>Forecast for the coming days</h2>
                <ul id="list-forecast">
                    <li class="forecast-day">
                        <div class="col-1">
                            <span class="day-weak">Sunday</span>
                            <div class="icon-container">
                                <img src="./assets/img/iconStorm.png" alt="" class="icon">
                            </div>
                        </div>
                        <div class="container-progress-bar">
                            <span class="min">10°</span>
                            <div class="progress-bar">
                                <span class="progress"></span>
                            </div>
                            <span class="max">30°</span>
                        </div>
                    </li>
                    <li class="forecast-day">
                        <div class="col-1">
                            <span class="day-weak">Monday</span>
                            <div class="icon-container">
                                <img src="./assets/img/iconStorm.png" alt="" class="icon">
                            </div>
                        </div>
                        <div class="container-progress-bar">
                            <span class="min">10°</span>
                            <div class="progress-bar">
                                <span class="progress"></span>
                            </div>
                            <span class="max">30°</span>
                        </div>
                    </li>
                    <li class="forecast-day">
                        <div class="col-1">
                            <span class="day-weak">Tuesday</span>
                            <div class="icon-container">
                                <img src="./assets/img/iconCloud.png" alt="" class="icon">
                            </div>
                        </div>
                        <div class="container-progress-bar">
                            <span class="min">10°</span>
                            <div class="progress-bar">
                                <span class="progress"></span>
                            </div>
                            <span class="max">30°</span>
                        </div>
                    </li>
                    <li class="forecast-day">
                        <div class="col-1">
                            <span class="day-weak">Wednesday</span>
                            <div class="icon-container">
                                <img src="./assets/img/iconClear.png" alt="" class="icon">
                            </div>
                        </div>
                        <div class="container-progress-bar">
                            <span class="min">10°</span>
                            <div class="progress-bar">
                                <span class="progress"></span>
                            </div>
                            <span class="max">30°</span>
                        </div>
                    </li>
                    <li class="forecast-day">
                        <div class="col-1">
                            <span class="day-weak">Thursday</span>
                            <div class="icon-container">
                                <img src="./assets/img/iconRain.png" alt="" class="icon">
                            </div>
                        </div>
                        <div class="container-progress-bar">
                            <span class="min">10°</span>
                            <div class="progress-bar">
                                <span class="progress"></span>
                            </div>
                            <span class="max">30°</span>
                        </div>
                    </li>
                    <li class="forecast-day">
                        <div class="col-1">
                            <span class="day-weak">Friday</span>
                            <div class="icon-container">
                                <img src="./assets/img/iconStorm.png" alt="" class="icon">
                            </div>
                        </div>
                        <div class="container-progress-bar">
                            <span class="min">10°</span>
                            <div class="progress-bar">
                                <span class="progress"></span>
                            </div>
                            <span class="max">30°</span>
                        </div>
                    </li>
                </ul>
            </section>
        </div>
    </main>
    <script type="module" src="./assets/js/apiCall.js"></script>
    <script type="module" src="./assets/js/setContent.js"></script>
</body>
</html>
